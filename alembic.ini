# Database migration config
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://postgres:uLFIfDIzxzTuxLbNBdNn@altex-chat.crek440ck7co.ap-northeast-1.rds.amazonaws.com:5432/altex-chat?sslmode=require

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
