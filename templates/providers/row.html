<tr id="provider-{{ provider.id }}" class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <div class="w-8 h-8 bg-primary-100 dark:bg-primary-900/20 rounded-lg flex items-center justify-center mr-3">
                <span class="text-primary-600 dark:text-primary-400 text-sm font-medium">{{ provider.name[0] | upper }}</span>
            </div>
            <div>
                <div class="text-sm font-medium text-gray-900 dark:text-white">{{ provider.name }}</div>
                {% if provider.prefix %}
                <div class="text-xs text-gray-500 dark:text-gray-400">Prefix: {{ provider.prefix }}</div>
                {% endif %}
            </div>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <code class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded text-gray-700 dark:text-gray-300">{{ provider.base_url }}</code>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        <span class="inline-flex items-center px-2 py-1 text-xs font-medium rounded bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300">
            {{ provider.auth_type }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        {% if provider.is_active %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/20 dark:text-green-400">
            <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-green-500"></span>
            Active
        </span>
        {% else %}
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-400">
            <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-gray-400"></span>
            Inactive
        </span>
        {% endif %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{ provider.created_at | timestamp }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
        <div class="flex items-center justify-end space-x-2">
            <!-- Test Connection -->
            <button 
                hx-post="/admin/providers/{{ provider.id }}/test"
                hx-target="#test-result-{{ provider.id }}"
                hx-swap="innerHTML"
                class="text-gray-400 hover:text-green-600 dark:text-gray-500 dark:hover:text-green-400 p-1 rounded transition-colors"
                title="Test Connection"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </button>
            <span id="test-result-{{ provider.id }}" class="text-xs"></span>
            
            <!-- Toggle Active -->
            <button 
                hx-post="/admin/providers/{{ provider.id }}/toggle"
                hx-target="#provider-{{ provider.id }}"
                hx-swap="outerHTML"
                class="text-gray-400 hover:text-blue-600 dark:text-gray-500 dark:hover:text-blue-400 p-1 rounded transition-colors"
                title="{% if provider.is_active %}Deactivate{% else %}Activate{% endif %}"
            >
                {% if provider.is_active %}
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                {% else %}
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                {% endif %}
            </button>
            
            <!-- Edit -->
            <a 
                href="/admin/providers/{{ provider.id }}"
                class="text-gray-400 hover:text-primary-600 dark:text-gray-500 dark:hover:text-primary-400 p-1 rounded transition-colors"
                title="Edit"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
            </a>
            
            <!-- Delete -->
            <button 
                hx-delete="/admin/providers/{{ provider.id }}"
                hx-target="#provider-{{ provider.id }}"
                hx-swap="outerHTML swap:0.5s"
                hx-confirm="Are you sure you want to delete provider '{{ provider.name }}'?"
                class="text-gray-400 hover:text-red-600 dark:text-gray-500 dark:hover:text-red-400 p-1 rounded transition-colors"
                title="Delete"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>
    </td>
</tr>
